 else if(a==='rel'&&v){v.releasedAt=new Date().toISOString();delete v.approx;if(await put(v)){close();toast('تم تسليم السيارة وحُفظت في الأرشيف')}}
 else if(a==='wa'&&v)waSheet(recText(v));else if(a==='waSum')waSheet(sumText());
 else if(a==='copy'){const t=$('#wt');t.select();try{await navigator.clipboard.writeText(t.value)}catch{document.execCommand('copy')}toast('تم النسخ')}
 else if(a==='excel')excel();else if(a==='imp')$('#fi').click();
 else if(a==='exp'){if(!dl)return toast('التحميل غير متاح هنا');try{await dl.save({filename:'نسخة-احتياطية-'+today()+'.json',data:JSON.stringify({app:'pk2',settings:S,visits:V})})}catch{toast('لم يتم حفظ الملف')}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#ar').innerHTML=tr(arList())}if(e.target.id==='qs'){qs=e.target.value;$('#sl').innerHTML=tr(spList(bySpot()))}});
document.addEventListener('change',e=>{if(e.target.id==='lg'){L=e.target.value;try{localStorage.pkl=L}catch{}close();render();return}if(e.target.id==='f_days')$('#f_price').value=rate(e.target.value);if(e.target.id==='fi'&&e.target.files[0]){doImport(e.target.files[0]);e.target.value=''}});
dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
init();
</script></body></html>
